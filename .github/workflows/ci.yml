name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPCS + PHPStan + PHPUnit
        run: composer check
